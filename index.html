<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Avatar AR</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
  <a-scene
    webxr="optionalFeatures: hit-test, dom-overlay;"
    renderer="colorManagement: true;"
    xr-mode-ui="enabled: true"
  >
      <a-entity light="type: ambient; intensity: 1.0"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 1 0"></a-entity>

      <a-entity
        id="avatar"
        gltf-model="url(me_greetings.glb)"
        scale="0.5 0.5 0.5"
        animation-mixer="clip: *; loop: repeat"
        position="0 0 -2"
      ></a-entity>
      
      <a-entity camera position="0 1.6 3"></a-entity>
      
    </a-scene>
  </body>
</html>
