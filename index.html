<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Avatar AR Animado</title>

    <!-- A-Frame + módulo WebXR AR -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!-- animation-mixer -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene
      webxr="mode: ar; optionalFeatures: dom-overlay;"
      renderer="colorManagement: true; physicallyCorrectLights: true;"
      xr-mode-ui="enabled: true"
    >
      <a-entity light="type: ambient; intensity: 1"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 1 0"></a-entity>

      <a-plane rotation="-90 0 0" width="4" height="4" color="#999"></a-plane>


<a-entity
  gltf-model="url(me_greetings.glb)"
  rotation="0 0 0"   
  scale="1 1 1"
  animation-mixer="clip: *; loop: repeat"
></a-entity>
      <a-entity camera look-controls position="0 1.6 3"></a-entity>
    </a-scene>
  </body>
</html>
