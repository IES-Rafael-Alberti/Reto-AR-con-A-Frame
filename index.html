<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>AR en el suelo (sin marcadores)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      .btn-colocar {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 16px;
        z-index: 10;
      }
    </style>
  </head>

  <body>
    <button class="btn-colocar" id="colocar">Colocar modelo</button>

    <a-scene
      xr-mode-ui="enabled: true"
      renderer="colorManagement: true; physicallyCorrectLights: true;"
      webxr="optionalFeatures: hit-test, local-floor;"
      embedded
    >
      <!-- Luz ambiental y direccional -->
      <a-entity light="type: ambient; intensity: 1"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>

      <!-- Modelo (oculto hasta colocarlo) -->
      <a-entity
        id="modelo"
        gltf-model="url(me_greetings.glb)"
        scale="0.5 0.5 0.5"
        visible="false"
        animation-mixer="clip: *; loop: repeat"
      ></a-entity>

      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
      const scene = document.querySelector("a-scene");
      const model = document.getElementById("modelo");
      const btn = document.getElementById("colocar");
      let hitTestSource = null;
      let localSpace = null;
      let xrHitTestSource = null;
      let placed = false;

      scene.addEventListener("enter-vr", async function () {
        if (scene.renderer.xr.isPresenting) {
          const session = scene.renderer.xr.getSession();
          const viewerSpace = await session.requestReferenceSpace("viewer");
          xrHitTestSource = await session.requestHitTestSource({ space: viewerSpace });
          localSpace = await session.requestReferenceSpace("local-floor");

          session.addEventListener("end", () => {
            xrHitTestSource = null;
          });
        }
      });

      scene.renderer.xr.addEventListener("sessionstart", () => {
        console.log("AR session started");
      });

      // Colocar el modelo al presionar el botón
      btn.addEventListener("click", () => {
        placed = true;
        btn.style.display = "none";
      });

      // Detección del suelo y colocación del modelo
      scene.renderer.xr.addEventListener("beforexrframe", (time, frame) => {
        if (!xrHitTestSource || !placed) return;
        const referenceSpace = localSpace;
        const hitTestResults = frame.getHitTestResults(xrHitTestSource);
        if (hitTestResults.length > 0) {
          const pose = hitTestResults[0].getPose(referenceSpace);
          model.object3D.position.set(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
          model.object3D.visible = true;
        }
      });
    </script>
  </body>
</html>
