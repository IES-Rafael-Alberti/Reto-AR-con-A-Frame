<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Avatar AR Animado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <!-- Componente AR Hit Test -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-ar-hit-test-component@1.0.2/dist/aframe-ar-hit-test-component.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      ar-hit-test="target:#avatar; type: transient; reticle:#reticle;"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      xr-mode-ui="enabled: true"
    >
      <!-- Luces -->
      <a-entity light="type: ambient; intensity: 1"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 1 0"></a-entity>

      <!-- Retículo (círculo guía para el plano detectado) -->
      <a-ring
        id="reticle"
        visible="false"
        color="lime"
        radius-inner="0.05"
        radius-outer="0.06"
        position="0 0 -1"
        rotation="-90 0 0"
      ></a-ring>

      <!-- Modelo -->
      <a-entity
        id="avatar"
        visible="false"
        gltf-model="url(me_greetings.glb)"
        scale="1 1 1"
        animation-mixer="clip: *; loop: repeat"
      ></a-entity>

      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
      const scene = document.querySelector('a-scene');
      const avatar = document.querySelector('#avatar');

      // Cuando el usuario toca la pantalla en modo AR:
      scene.addEventListener('ar-hit-test-select', (e) => {
        avatar.setAttribute('visible', true);
        avatar.object3D.position.copy(e.detail.position);
        avatar.object3D.quaternion.copy(e.detail.rotation);
      });
    </script>
  </body>
</html>
