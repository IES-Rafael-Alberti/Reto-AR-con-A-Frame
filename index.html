<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame AR | me_greetings</title>
    <meta name="description" content="Visor AR para el modelo me_greetings.glb">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene webxr="requiredFeatures: hit-test;">

      <a-assets>
        <a-asset-item id="modelo-saludo" src="me_greetings.glb"></a-asset-item>
      </a-assets>

      <a-light type="ambient" color="#FFFFFF" intensity="0.7"></a-light>
      <a-light type="directional" position="-1 2 1" intensity="0.6"></a-light>

      <a-gltf-model
        src="#modelo-saludo"
        scale="0.5 0.5 0.5" 
        ar-hit-test
      >
      </a-gltf-model>

    </a-scene>
  </body>
</html>
